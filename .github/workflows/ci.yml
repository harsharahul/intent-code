name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install intent-vector-db (the intent-db library, public git) and this package
        run: |
          uv pip install "intent-vector-db @ git+https://github.com/harsharahul/intent-db@main"
          uv pip install --no-sources -e ".[treesitter,dev]"
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: uv run --no-sync pip-audit --skip-editable
