name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read # checkout the repo (required for private repos)
      id-token: write # PyPI trusted publishing (OIDC); no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Verify the release tag matches the package version
        run: |
          tag="${{ github.event.release.tag_name }}"
          ver="v$(grep -m1 -E '^version = ' pyproject.toml | cut -d'"' -f2)"
          echo "release tag=$tag  pyproject=$ver"
          test "$tag" = "$ver" || { echo "::error::release tag $tag != pyproject version $ver"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
